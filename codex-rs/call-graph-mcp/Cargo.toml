[package]
edition.workspace = true
license.workspace = true
name = "codex-call-graph-mcp"
version.workspace = true

[lib]
name = "codex_call_graph_mcp"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-call-graph-mcp"
path = "src/bin/server.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
blake3 = "1"
codex-call-graph-perception = { workspace = true }
codex-call-graph-store = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["schemars", "server", "transport-async-rw"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "rt-multi-thread"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
